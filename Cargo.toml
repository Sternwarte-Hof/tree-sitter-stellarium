[package]
name = "tree-sitter-stellarium"
description = "Parser for Stellarium Scripting Engine"
version = "0.1.0"
authors = ["Tobias Feigel <info@feigel.it>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "stellarium"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/fits-ki/tree-sitter-stellarium"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.3"

[lints.clippy]
const_is_empty = "allow"
